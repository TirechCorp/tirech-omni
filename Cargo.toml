[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TirechCorp/tirech-omni"

[workspace.dependencies]
# A biblioteca de interface, no repositório ao lado. Para usar uma versão publicada, troque o
# `path` pela versão (`tomni-ui = "0.1"`) nas cinco linhas.
tomni-ui = { path = "../tomni-ui/crates/tomni-ui" }
tomni-ui-files = { path = "../tomni-ui/crates/files" }
tomni-ui-terminal = { path = "../tomni-ui/crates/terminal" }
tomni-ui-test = { path = "../tomni-ui/crates/test" }
tomni-ui-ai = { path = "../tomni-ui/crates/ai" }
# A rede Nebula embutida: o túnel só para o tráfego do app, sem placa virtual.
tomni-ui-nebula = { path = "../tomni-ui/crates/nebula" }
# O OpenVPN embutido: o túnel só para o tráfego do app, sem placa virtual.
tomni-ui-openvpn = { path = "../tomni-ui/crates/openvpn" }
# O WireGuard e o Tailscale embutidos: os túneis só para o tráfego do app, sem placa virtual.
tomni-ui-wireguard = { path = "../tomni-ui/crates/wireguard" }
tomni-ui-tailscale = { path = "../tomni-ui/crates/tailscale" }
# O ZeroTier embutido: a rede só para o tráfego do app, sem placa virtual.
tomni-ui-zerotier = { path = "../tomni-ui/crates/zerotier" }
# O UDP real dos servidores de teste do ZeroTier (só nos testes do app).
tomni-ui-netstack = { path = "../tomni-ui/crates/netstack" }
# O pipe com dono e o pid de quem conecta (só no Windows): o canal entre a ponte MCP e o app.
tomni-ui-win32 = { path = "../tomni-ui/crates/win32" }
# A CPU e a memória dos processos no macOS (a página Desempenho).
tomni-ui-macos = { path = "../tomni-ui/crates/macos" }

# Externos, nas mesmas versões da biblioteca (o Cargo.lock veio de lá). Todos dentro do deny.toml.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Cofre de senhas: AES-256-GCM, Argon2id, sorteio e base64. Já vêm no Cargo.lock pelo
# russh; o app só os chama.
aes-gcm = "0.11.1"
argon2 = "0.6.0"
getrandom = "0.3.4"
base64 = "0.22.1"
# O SHA-256 dos anexos das notas: já está no Cargo.lock.
sha2 = "0.11"
# Logs cifrados: X25519 (curve25519-dalek) e HKDF-SHA256. Já estão no Cargo.lock pelo russh.
curve25519-dalek = "5.0.0"
hkdf = "0.13.0"
# Chaves SSH: a mesma versão exata que o `russh` fixa.
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["std", "crypto", "encryption", "ppk", "rand_core"] }
# Importar e exportar: o XML dos gerenciadores e as cifras dos outros programas (a do
# mRemoteNG é PBKDF2-HMAC-SHA1 com AES-GCM ou AES-CBC e MD5). Já estão no Cargo.lock.
quick-xml = { version = "0.41", default-features = false }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha1 = "0.11"
md-5 = "0.11"
aes = "0.9"
cbc = "0.2"
jiff = { version = "0.2", default-features = false, features = ["std"] }
# A interface em outros idiomas: o Project Fluent e o idioma do sistema.
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1", default-features = false }
# Os PNGs e o `.ico` do ícone, gerados dos SVG: a mesma versão do Cargo.lock da lib.
png = "0.18.1"
# O ícone e a versão dentro do `.exe` do Windows, só no `build.rs`; sem o `toml`, que lê o
# `Cargo.toml` e aqui não faz falta (os campos vão escritos no `build.rs`). Licença MIT.
# O nome desta máquina, para saber se um `file://` do terminal é daqui. Já está no Cargo.lock.
gethostname = "1.1.0"
winresource = { version = "0.1.34", default-features = false }
# A IA dentro do app: a redação de segredos (`redacao.rs`) usa expressões regulares, e os
# segredos do cofre ficam em `Zeroizing`, a mesma versão da lib.
regex = "1.12"
zeroize = "1.9"
# O TLS do relé das portas e os servidores de teste (SFTP, S3) de `crates/tirech-omni/tests/comum`:
# as mesmas versões e features que a lib já tem no Cargo.lock.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
rcgen = "0.14"
rusty-s3 = "0.10.2"
percent-encoding = "2"
url = "2"
# Colar pastas: o pacote `tar` e o gzip são montados dentro do app, só como biblioteca.
# O `flate2` já está no Cargo.lock pelo `russh` (backend `miniz_oxide`, Rust puro); sem as
# features `zlib` nem `zlib-rs`. O `tar` sem o `xattr`, que só serve no Unix.
tar = { version = "0.4.46", default-features = false }
flate2 = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
# Dependências otimizadas deixam o render CPU e os snapshots rápidos em dev.
opt-level = 2
